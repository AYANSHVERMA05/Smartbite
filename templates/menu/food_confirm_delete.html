{% extends 'base.html' %}

{% block title %}Delete Food Item - SmartBite{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card sb-card text-center p-4">
                <div class="mb-3 text-danger">
                    <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
                </div>
                <h4 class="fw-bold mb-2">Delete Dish?</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to delete <strong>{{ food.name }}</strong> from your menu? This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'dashboard:owner_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Dish</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
